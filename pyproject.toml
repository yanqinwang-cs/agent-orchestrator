[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Agent Lab: a deterministic local orchestration foundation and a local discovery and composition API for intelligent-system experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["agents", "orchestration", "benchmarking", "experiments"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai-codex==0.159.2",
    "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/yanqinwang-cs/agent-orchestrator"

[project.scripts]
agent-orchestrator = "orchestrator.cli:main"
agent-lab-api = "agent_lab.server:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator", "src/agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests that make explicitly authorized live provider calls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PIE", "RUF", "PERF", "ASYNC"]
# Exception names are public error contracts; renaming them is a separate migration.
# Nested ifs, try/except-pass cleanup and explicit loop building in the engine read as written;
# rewriting them would churn run logic without changing behavior.
ignore = ["N818", "SIM102", "SIM105", "PERF401", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Regression files import fixtures from the suites that own them; pytest injects them by name.
"tests/test_*_regressions.py" = ["F811", "F401"]
# The start path reads small local config files synchronously before any turn exists.
"src/orchestrator/backends/codex_backend.py" = ["ASYNC240"]
# The study's inspector makes short calls to a local browser debug port; blocking there is harmless.
"studies/ceramic-campaign/verify.py" = ["ASYNC210"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["orchestrator", "agent_lab"]
show_error_codes = true
warn_unused_configs = true
# Checks type errors inside untyped test bodies too. The packages are checked with `mypy --strict`
# (see .github/workflows/checks.yml); strict is not set here because a per-module strict override
# also leaks into the tests.
check_untyped_defs = true
