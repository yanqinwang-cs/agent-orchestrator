[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "A deterministic local orchestration foundation for specialist workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-codex==0.159.2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
harness = [
    "deepagents==0.4.11",
    "langchain==1.2.12",
    "langgraph==1.1.2",
    "langgraph-prebuilt==1.0.8",
]

[project.scripts]
agent-orchestrator = "orchestrator.cli:main"
agent-lab-api = "agent_lab.server:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator", "src/agent_lab", "src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests that make explicitly authorized live provider calls"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/check_starter.py", "scripts/codex_task.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["orchestrator", "agent_lab", "agent_harness"]
show_error_codes = true
warn_unused_configs = true
