name: Agent Lab backend

on:
  pull_request:
    branches:
      - codex/research

permissions:
  contents: read

jobs:
  agent-lab-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify dependency lock
        run: uv lock --check

      - name: Test Agent Lab backend
        env:
          PYTHONPATH: src
        run: uv run pytest -q tests/test_agent_lab_store.py tests/test_agent_lab_http_api.py

      - name: Lint Agent Lab backend
        run: uv run ruff check src/agent_lab tests/test_agent_lab_store.py tests/test_agent_lab_http_api.py

      - name: Check Agent Lab formatting
        run: uv run ruff format --check src/agent_lab tests/test_agent_lab_store.py tests/test_agent_lab_http_api.py

      - name: Type-check Agent Lab backend
        run: uv run mypy --follow-imports=normal src/agent_lab
