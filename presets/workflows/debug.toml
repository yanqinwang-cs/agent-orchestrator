# Proposed WorkflowPreset schema v1. Conditions and stage kinds are closed enums.
schema_version = 1
id = "debug"
version = "1.0.0"
name = "Debug"
max_parallelism = 2
max_duration_seconds = 7200
max_attempts_per_slot = 2
max_repair_cycles = 0
allowed_profiles = ["debugger", "implementer", "tester", "reviewer", "handoff"]
completion = "verified_revision"
required_outputs = ["handoff.summary"]
allowed_redirects = []

[policy]
allowed_backends = ["codex"]
allowed_model_bindings = ["standard", "deep", "fast"]
allow_optional_skip = false
allow_count_selection = false
allow_profile_selection = false
allow_retry = true
allow_permission_expansion = false
allow_new_profiles = false
allow_required_stage_removal = false

[[stages]]
id = "diagnose"
kind = "worker"
depends_on = []
inputs = ["task"]
required_outputs = ["diagnosis"]
when = "always"
optional = false
completion = "artifact_ready"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["debugger"]
default_profile = "debugger"

[[stages]]
id = "implement"
kind = "worker"
depends_on = ["diagnose"]
inputs = ["task", "diagnose.diagnosis"]
required_outputs = ["changes"]
when = "always"
optional = false
completion = "artifact_ready"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["implementer"]
default_profile = "implementer"

[[stages]]
id = "integrate"
kind = "integrate"
depends_on = ["implement"]
inputs = ["implement.changes"]
required_outputs = ["revision"]
when = "always"
optional = false
completion = "integration_succeeded"

[[stages]]
id = "test"
kind = "worker"
depends_on = ["integrate"]
inputs = ["task", "diagnose.diagnosis", "integrate.revision"]
required_outputs = ["report"]
when = "always"
optional = false
completion = "report_passed"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["tester"]
default_profile = "tester"

[[stages]]
id = "review"
kind = "worker"
depends_on = ["test"]
inputs = ["task", "diagnose.diagnosis", "integrate.revision", "test.report"]
required_outputs = ["report"]
when = "always"
optional = false
completion = "report_passed"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["reviewer"]
default_profile = "reviewer"

[[stages]]
id = "handoff"
kind = "worker"
depends_on = ["review"]
inputs = ["task", "integrate.revision", "test.report", "review.report"]
required_outputs = ["summary"]
when = "always"
optional = false
completion = "artifact_ready"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["handoff"]
default_profile = "handoff"
