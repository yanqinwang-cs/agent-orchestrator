# Shipped WorkflowPreset schema v1. Conditions and stage kinds are closed enums.
schema_version = 1
id = "research"
version = "1.0.0"
name = "Research"
max_parallelism = 3
max_duration_seconds = 5400
max_attempts_per_slot = 2
max_repair_cycles = 0
allowed_profiles = ["researcher", "synthesizer", "verifier", "reviewer"]
completion = "verified_research"
required_outputs = ["verify.report"]
allowed_redirects = [{ stage = "verify", allowed_profiles = ["verifier", "reviewer"] }]

[policy]
allowed_backends = ["codex"]
allowed_model_bindings = ["standard", "deep", "fast"]
allow_optional_skip = false
allow_count_selection = true
allow_profile_selection = true
allow_retry = true
allow_permission_expansion = false
allow_new_profiles = false
allow_required_stage_removal = false

[[stages]]
id = "research"
kind = "worker"
slot_briefs = ["Investigate the mechanism and strongest primary evidence for the task.", "Investigate limitations, counterexamples and uncertainty relevant to the task.", "Investigate implementation implications and practical constraints relevant to the task."]
depends_on = []
inputs = ["task"]
required_outputs = ["findings"]
when = "always"
optional = false
completion = "artifact_ready"
slot_kind = "elastic"
min_workers = 2
max_workers = 3
allowed_profiles = ["researcher"]
default_profile = "researcher"
parallel_group = "research"

[[stages]]
id = "synthesize"
kind = "worker"
depends_on = ["research"]
inputs = ["task", "research.findings"]
required_outputs = ["synthesis"]
when = "always"
optional = false
completion = "artifact_ready"
slot_kind = "fixed"
min_workers = 1
max_workers = 1
allowed_profiles = ["synthesizer"]
default_profile = "synthesizer"

[[stages]]
id = "verify"
kind = "worker"
depends_on = ["synthesize"]
inputs = ["task", "research.findings", "synthesize.synthesis"]
required_outputs = ["report"]
when = "always"
optional = false
completion = "report_passed"
slot_kind = "select_one"
min_workers = 1
max_workers = 1
allowed_profiles = ["verifier", "reviewer"]
default_profile = "verifier"
