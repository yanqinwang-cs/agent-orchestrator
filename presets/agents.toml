# Current v1 product AgentProfile defaults; distinct from repository development Codex presets.
# Profile backend/model fields are fixed/default bindings today; see the plan for the target split.
schema_version = 1

[[agents]]
id = "planner"
version = "1.0.0"
name = "Planner"
role = "planning"
objective = "Partition the task into bounded responsibilities and explicit acceptance evidence."
base_prompt = "Read the task and relevant sources. Return a plan with dependencies, shared-file risks, proposed worker count and disjoint ownership where parallelism is useful. Stay within the supplied scope and worker bounds."
overlay_paths = []
backend = "codex"
model_binding = "standard"
effort = "high"
skills = []
tools = ["shell", "read_files"]
permissions = { sandbox = "read-only", shell_network = false, web_search = false, approval_mode = "deny_all", external_integrations = false, nested_agents = false }
context_policy = { id = "scoped-v1", max_bytes = 96000, include_full_history = false }
memory_policy = "disabled"
timeout_seconds = 600
retry_policy = { max_attempts = 2, recoverable_classes = ["provider_transient", "tool_transient"], require_known_terminal = true, require_safe_retry = true }
required_outputs = ["plan"]
metadata = { owner = "project", output_schema = "artifact-envelope-v1" }

[[agents]]
id = "implementer"
version = "1.0.0"
name = "Implementer"
role = "implementation"
objective = "Implement the assigned slice and preserve its verification evidence."
base_prompt = "Work only in the assigned workspace and ownership slice. Read the provided plan and contracts. Make the bounded change, run relevant checks and return changes, evidence and unresolved issues. Do not integrate peer work or redefine scope."
overlay_paths = []
backend = "codex"
model_binding = "standard"
effort = "high"
skills = []
tools = ["shell", "read_files", "edit_files"]
permissions = { sandbox = "workspace-write", shell_network = false, web_search = false, approval_mode = "deny_all", external_integrations = false, nested_agents = false }
context_policy = { id = "scoped-v1", max_bytes = 96000, include_full_history = false }
