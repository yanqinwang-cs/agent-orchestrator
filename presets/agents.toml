timeout_seconds = 1200
retry_policy = { max_attempts = 2, recoverable_classes = ["provider_transient", "tool_transient"], require_known_terminal = true, require_safe_retry = true }
required_outputs = ["changes"]
metadata = { owner = "project", output_schema = "artifact-envelope-v1" }

