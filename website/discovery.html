</style><div class="ed" id="ed-review"><div class="tools"><label><input type="checkbox" id="ed-narrow">390px preview</label></div><figure class="stage" aria-label="Retained discovery design"><div class="site" id="ed-site"></div></figure><p class="caption" id="ed-caption"></p><input type="hidden" id="ed-snapshot"></div><script>
(()=>{'use strict';
const root=document.getElementById('ed-review'),site=document.getElementById('ed-site');
const state={version:2,direction:'editorial',scope:'website-design-only',intro:'separate-task',design:{discovery:'feature',evidence:'visible',picker:'beside'},demo:{page:'explore',narrow:false}};
const pages={explore:'Discovery',detail:'Resource detail',saved:'Saved setups',editor:'Editor',suggest:'Suggestions'};
const data=[
{name:'Review checklist',kind:'Skill',outcome:'Review a change with a clear checklist.',summary:'Inspect behavior, edge cases, security and tests before sharing actionable findings.',versions:{'1.1.0':'Review the change against its stated intent. Check behavior, edge cases, security, and tests. Prioritize actionable findings with file and line references; distinguish confirmed defects from questions.','1.0.0':'Inspect behavior, boundary conditions, security, and test coverage. Report actionable findings with file and line references.'}},
{name:'Clarify a task',kind:'Prompt',outcome:'Turn a request into a clear brief.',summary:'Make the outcome, constraints and acceptance criteria explicit before work begins.',versions:{'1.0.0':'Restate the requested outcome. Identify constraints and observable acceptance criteria. Ask only for information that blocks safe progress.'}},
{name:'Research assistant configuration',kind:'Agent',outcome:'Keep facts separate from interpretation.',summary:'A provider-neutral starting point for evidence-led research.',versions:{'1.0.0':'Role: research assistant.\nMethod: separate sourced facts from interpretation and uncertainty.\nOutput: concise findings with source references and unresolved questions.\nThis is configuration data, not a runnable agent.'}},
{name:'Workspace search tool definition',kind:'Tool',outcome:'Find the right text in a workspace.',summary:'A descriptive contract for matching paths and line excerpts.',versions:{'1.0.0':'Purpose: find text or paths in a user-selected workspace.\nInputs: query (required string), optional path_glob (string).\nOutput: matching paths and line excerpts.\nEffects: read-only. This catalog record does not install or run a tool.'}},
{name:'Interface notes plugin definition',kind:'Plugin',outcome:'Keep interface decisions with their reasons.',summary:'A descriptive bundle for concise project notes.',versions:{'1.0.0':'Purpose: capture a concise record of interface decisions and constraints.\nInputs: decision, rationale, and affected contract.\nEffects: none. This catalog entry describes a plugin; it does not install one.'}},
{name:'Read-only filesystem MCP profile',kind:'MCP',outcome:'Describe a read-only connection.',summary:'An illustrative server profile, not a configured connection.',versions:{'1.0.0':'Transport: stdio (illustrative).\nPermission intent: read-only access to an explicitly selected directory.\nThis profile is descriptive only. No server is launched by this website.'}}
];
let resource=0,version='1.1.0',query='',kind='All',browseAll=false,setupQuery='',pickerQuery='',pickerKind='All',pickerOpen=true,destination=false,notice='',undo=null,replace=null,dirty=false,scenario='normal',suggestStep='form',errors=false;
let suggestion={link:'',purpose:'',name:'',example:''};
let setups=[{id:1,name:'Research setup',purpose:'Instructions and resources for evidence-led research.',bindings:[{r:1,v:'1.0.0'},{r:2,v:'1.0.0'}]},{id:2,name:'Review setup',purpose:'A checklist for reviewing a proposed change.',bindings:[{r:0,v:'1.1.0'}]}];
const clone=x=>JSON.parse(JSON.stringify(x));let draft=clone(setups[0]);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,attrs='',cls='secondary')=>`<button type="button" class="${cls}" ${attrs}>${text}</button>`;
const latest=r=>Object.keys(data[r].versions)[0];
const kinds=['All','Prompts','Skills','Plugins & tools','MCPs','Agents & setups'];
const matches=(r,k)=>k==='All'||(k==='Prompts'&&r.kind==='Prompt')||(k==='Skills'&&r.kind==='Skill')||(k==='Plugins & tools'&&['Plugin','Tool'].includes(r.kind))||(k==='MCPs'&&r.kind==='MCP')||(k==='Agents & setups'&&r.kind==='Agent');
function sync(){document.getElementById('ed-snapshot').value=JSON.stringify(state);root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.demo.page)));document.getElementById('ed-caption').textContent=pages[state.demo.page]+' · '+(state.demo.narrow?'390px':'Wide')+' preview. Catalog and workspace actions are simulated; reference links open local pages or sources.';}
function go(p){state.demo.page=p;scenario='normal';notice='';destination=false;render();}
function openResource(i){resource=i;version=latest(i);go('detail');}
function filters(){return `<div class="kinds" aria-label="Resource types">${kinds.map(k=>btn(k,`data-kind="${esc(k)}" aria-pressed="${k===kind}"`,'')).join('')}</div>`;}
function resourceRow(r,i){return `<article class="resource-row"><div class="type">${r.kind}<br><span class="mono">${latest(i)}</span></div><div><h2>${esc(r.outcome)}</h2><p class="muted">${esc(r.name)}</p><div class="metadata">No Lab test yet</div></div>${btn('Read →',`data-resource="${i}"`,'line-button')}</article>`;}
function explore(){const list=data.map((r,i)=>({...r,i})).filter(r=>matches(r,kind)&&(!query||(r.name+' '+r.outcome+' '+r.summary+' '+Object.values(r.versions).join(' ')).toLowerCase().includes(query.toLowerCase())));const isFeature=state.design.discovery==='feature'&&!browseAll&&!query&&kind==='All'&&scenario!=='empty';return `<main><div class="eyebrow">A library for thoughtful agent work</div><h1>Start with what you<br>want to do.</h1><p class="muted">Explore resources. Understand what they offer. Shape your own setup.</p><nav aria-label="Browse references"><div class="section-label">Browse references</div><div class="reference-links"><a href="references/frontend/">Frontend design →<span>Website references and studies</span></a><a href="references/blender/">Blender &amp; animation →<span>Modelling · Animation</span></a><a href="references/workflows/">Everyday workflows →<span>Simple workflows · Build an agent</span></a></div></nav><label for="ed-query">Search resources</label><div class="search"><input id="ed-query" type="search" value="${esc(query)}" placeholder="Try review, research or a task…">${btn('Search','data-search','primary')}</div>${filters()}${scenario==='empty'||!list.length?`<section class="empty"><h2>No resources match.</h2><p class="muted">Try a broader search or clear the resource type.</p>${btn('Clear filters','data-clear')}</section>`:isFeature?`<div class="section-label">A place to begin</div><div class="feature-grid"><article class="feature"><div class="index mono">01 / SKILL · 1.1.0</div><h2>${data[0].outcome}</h2><p class="muted small">${data[0].name}</p><div class="excerpt">Review the change against its stated intent. Check behavior, edge cases, security, and tests.</div><div class="metadata">No Lab test yet · Catalog example</div>${btn('Read the checklist →','data-resource="0"','line-button')}</article><div>${[1,2].map((i)=>`<article class="support"><div class="eyebrow">0${i+1} / ${data[i].kind}</div><h2>${data[i].outcome}</h2><p class="muted">${data[i].summary}</p><div class="metadata">${latest(i)} · No Lab test yet</div>${btn('Read resource →',`data-resource="${i}"`,'line-button')}</article>`).join('')}</div></div><div style="margin-top:30px">${btn('Browse all six examples →','data-all','line-button')}</div><section id="frozen-study" style="margin-top:30px;padding-top:24px;border-top:1px solid var(--rule)"><h2>Frozen visual study</h2><p class="muted">Four instructed design runs · 8 captures</p><a href="samples/four-instructed-runs/" style="color:var(--cyan);text-underline-offset:5px">View the frozen sample →</a></section>`:`<div class="section-label">${list.length} example${list.length===1?'':'s'}</div><div class="rows">${list.map(r=>resourceRow(r,r.i)).join('')}</div>`}</main>`;}
function facts(){return `<h3>Source and evidence</h3><div class="fact"><span>Source</span>Agent Lab catalog example. No external link supplied.</div><div class="fact"><span>Licence</span>Not supplied with this example.</div><div class="fact"><span>Testing</span>No Lab test yet. No performance claims.</div>`;}
function detail(){const r=data[resource];return `<main>${btn('← Back to resources','data-go="explore"','line-button back')}<div class="eyebrow">${r.kind} / Catalog example</div><h1>${esc(r.name)}</h1><p class="muted">${esc(r.summary)}</p><div class="detail-grid"><section class="reading"><h2>What it helps you do</h2><p>${esc(r.outcome)}</p><h3>Resource text <span class="mono muted">/ ${esc(version)}</span></h3><div class="excerpt">${esc(r.versions[version])}</div>${state.design.evidence==='visible'?`<section class="evidence">${facts()}</section>`:`<details><summary>Source and evidence · No Lab test yet</summary>${facts()}</details>`}<details><summary>Before you use this</summary><p>This is descriptive content, not an installed integration. Compatibility is not checked; nothing runs from this preview.</p></details></section><aside class="rail"><label for="ed-version">Exact version</label><select id="ed-version">${Object.keys(r.versions).map(v=>`<option ${v===version?'selected':''}>${v}</option>`).join('')}</select><p class="small muted" style="margin-top:12px">Your setup keeps this version until you choose another.</p>${btn('Add to setup','data-destination','primary')}<div class="fact"><span>Maintainer</span>Agent Lab</div><div class="fact"><span>Evidence</span>No Lab test yet</div>${destination?`<div class="destination"><label for="ed-destination">Choose a setup</label><select id="ed-destination"><option value="current">${esc(draft.name)} · current draft</option>${setups.filter(s=>s.id!==draft.id).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}<option value="new">New setup</option></select><p class="small" style="margin-top:12px">${r.kind==='Prompt'?'Prompt target: Research assistant.':'This resource will be shared by the setup.'}</p>${btn('Add and open draft','data-confirm-add','primary')}${btn('Cancel','data-cancel-add','line-button')}</div>`:''}</aside></div></main>`;}
function saved(){const list=scenario==='empty'?[]:setups.filter(s=>s.name.toLowerCase().includes(setupQuery.toLowerCase()));return `<main><div class="eyebrow">Workspace / Illustrative setups</div><div class="title-row"><div><h1>Good work starts<br>with a considered setup.</h1><p class="muted">Keep useful resources together. Return to the exact versions you chose.</p></div>${btn('New setup','data-new','primary')}</div><label for="ed-setup-query">Search saved setups</label><div class="search"><input id="ed-setup-query" type="search" value="${esc(setupQuery)}">${btn('Search','data-setup-search')}</div>${!list.length?`<section class="empty"><h2>${setupQuery?'No setups match.':'A place for your first setup.'}</h2><p class="muted">${setupQuery?'Try another name.':'Start with a resource, then add the instructions you need.'}</p>${btn(setupQuery?'Clear search':'Explore resources',setupQuery?'data-clear-setups':'data-go="explore"','primary')}</section>`:list.map(s=>`<article class="saved-row"><div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.purpose)}</p><div class="metadata"><span>${s.bindings.length} resource${s.bindings.length===1?'':'s'}</span><span>Exact versions retained</span></div></div><div class="row-actions">${btn('Open',`data-open="${s.id}"`)}${btn('Duplicate',`data-duplicate="${s.id}"`,'line-button')}</div></article>`).join('')}</main>`;}
function group(label,k){const list=draft.bindings.map((b,i)=>({...b,i})).filter(b=>matches(data[b.r],k));return `<section class="binding-group"><div class="group-head"><h2>${label}</h2>${btn('Add',`data-pick="${esc(k)}"`,'line-button')}</div>${list.length?list.map(b=>`<div class="binding"><strong>${esc(data[b.r].name)}</strong><div class="metadata">Pinned to ${esc(b.v)}${data[b.r].kind==='Prompt'?' · Research assistant':''}</div><div class="binding-actions">${btn('Replace',`data-replace="${b.i}"`,'line-button')}${btn('Remove',`data-remove="${b.i}"`,'line-button')}</div></div>`).join(''):'<p class="muted small" style="margin:0">Nothing added yet.</p>'}</section>`;}
function picker(){const list=data.map((r,i)=>({...r,i})).filter(r=>matches(r,pickerKind)&&(r.name+' '+r.outcome).toLowerCase().includes(pickerQuery.toLowerCase()));return `<aside class="picker"><div class="group-head"><h2>${replace!==null?'Replace resource':'Find resources'}</h2>${state.design.picker==='on-demand'?btn('Close','data-close-picker','line-button'):''}</div><p class="muted small">${pickerKind==='Prompts'?'For Research assistant':'Shared resources belong to this setup.'}</p><label for="ed-picker-query">Search resources</label><div class="search"><input id="ed-picker-query" type="search" value="${esc(pickerQuery)}"></div>${btn('Search','data-picker-search','line-button')}<label for="ed-picker-kind" style="margin-top:14px">Resource type</label><select id="ed-picker-kind">${kinds.map(k=>`<option ${k===pickerKind?'selected':''}>${esc(k)}</option>`).join('')}</select>${list.length?list.map(r=>`<div class="picker-item"><strong>${esc(r.name)}</strong><p class="muted">${r.kind} · ${latest(r.i)}</p>${btn(replace!==null?'Use this resource':r.kind==='Prompt'?'Add to Research assistant':'Add to setup',`data-add="${r.i}"`)}</div>`).join(''):'<p class="muted small" style="margin-top:18px">No resources match this search.</p>'}</aside>`;}
function editor(){const open=state.design.picker==='beside'||pickerOpen;return `<main>${btn('← Saved setups','data-go="saved"','line-button back')}<div class="title-row editor-title"><div><div class="eyebrow">Workspace / Setup editor</div><h1>${esc(draft.name)}</h1><p class="muted small" id="ed-save-state">${dirty?'Unsaved changes in this sketch':'Example draft · Nothing saved outside this preview'}</p></div>${btn('Save','data-save','primary')}</div>${scenario==='conflict'?`<div class="notice warning"><p>A newer saved version exists. Your draft is still here.</p>${btn('Keep draft as a copy','data-conflict-copy') }<p class="small" style="margin-top:10px">Simulated conflict; no real setup is affected.</p></div>`:''}${undo?`<div class="notice">Resource removed from the draft. ${btn('Undo','data-undo','line-button')}</div>`:''}<div class="editor-grid ${open?'':'closed'}"><section class="draft"><label for="ed-draft-name">Setup name</label><input class="name-input" id="ed-draft-name" value="${esc(draft.name)}"><div class="agent"><span>Prompt target</span><strong>Research assistant</strong></div>${group('Prompts','Prompts')}<p class="shared-label">Shared by this setup</p>${group('Skills','Skills')}${group('Plugins & tools','Plugins & tools')}${group('MCPs','MCPs')}${group('Agent configurations','Agents & setups')}<section class="binding-group"><h2 style="font-size:16px;letter-spacing:0">Model & settings</h2><label for="ed-model">Model</label><select id="ed-model" disabled><option>Supported choices not decided</option></select><details style="margin-top:15px"><summary>Advanced settings</summary><p>This layout reserves space for model settings. Supported fields and model choices still need a product decision.</p></details></section></section>${open?picker():''}</div></main>`;}
function suggest(){let body;if(suggestStep==='sent'){body=`<section class="receipt"><div class="eyebrow accent">Preview receipt</div><h2>Suggestion received<br>for review.</h2><p class="muted">This is the proposed confirmation screen. Nothing was actually sent or published.</p>${btn('Suggest another resource','data-another','primary')}</section>`;}else if(suggestStep==='review'){body=`<section><h2>Check your suggestion</h2><div class="fact"><span>Resource link</span>${esc(suggestion.link)}</div><div class="fact"><span>What it helps with</span>${esc(suggestion.purpose)}</div>${suggestion.name?`<div class="fact"><span>Name</span>${esc(suggestion.name)}</div>`:''}${suggestion.example?`<div class="fact"><span>Example link</span>${esc(suggestion.example)}</div>`:''}<p class="muted small" style="margin-top:20px">A suggestion is not a public listing. Review comes before publication.</p><div class="row-actions">${btn('Send suggestion','data-send','primary')}${btn('Edit','data-edit-suggestion')}</div></section>`;}else{const badLink=!/^https?:\/\/\S+\.\S+$/i.test(suggestion.link);const badPurpose=!suggestion.purpose.trim();const badExample=suggestion.example&&!/^https?:\/\/\S+\.\S+$/i.test(suggestion.example);body=`<section>${errors?`<div class="error-box" role="alert"><strong>Check your suggestion</strong><p style="margin:8px 0 0">${badLink?'Enter a full resource link. ':''}${badPurpose?'Describe what it helps with. ':''}${badExample?'Enter a full example link or leave it empty.':''}</p></div>`:''}<div class="form-field"><label for="ed-link">Resource link</label><input id="ed-link" type="url" placeholder="https://example.com/resource" value="${esc(suggestion.link)}" aria-invalid="${Boolean(errors&&badLink)}" aria-describedby="ed-link-error">${errors&&badLink?'<p id="ed-link-error" class="error">Enter a full resource link, starting with https:// or http://.</p>':'<span id="ed-link-error"></span>'}</div><div class="form-field"><label for="ed-purpose">What does it help with?</label><textarea id="ed-purpose" placeholder="Describe the task it helps someone do…" aria-invalid="${Boolean(errors&&badPurpose)}" aria-describedby="ed-purpose-error">${esc(suggestion.purpose)}</textarea>${errors&&badPurpose?'<p id="ed-purpose-error" class="error">Describe what this resource helps someone do.</p>':'<span id="ed-purpose-error"></span>'}</div><details ${errors&&badExample?'open':''}><summary>Optional details</summary><div style="margin-top:15px"><label for="ed-resource-name">Resource name</label><input id="ed-resource-name" value="${esc(suggestion.name)}"></div><div style="margin-top:15px"><label for="ed-example">Example link</label><input id="ed-example" type="url" value="${esc(suggestion.example)}" aria-invalid="${Boolean(errors&&badExample)}">${errors&&badExample?'<p class="error">Enter a full example link or leave it empty.</p>':''}</div></details><p class="muted small" style="margin-top:17px">Do not include private data, access codes or credentials.</p>${btn('Review suggestion →','data-review','primary')}</section>`;}return `<main><div class="suggest-grid"><section class="suggest-intro"><div class="eyebrow">Help the library grow</div><h1>Found something<br>worth sharing?</h1><p class="muted">Tell us what it helps someone do, not just what it is called.</p><div class="step"><span>01</span> Share a resource link and its purpose.</div><div class="step"><span>02</span> Check your suggestion before sending.</div><div class="step"><span>03</span> Review comes before public listing.</div><p class="small muted">Illustrative form. Nothing leaves this preview.</p></section>${body}</div></main>`;}
function demoOptions(){let opts=[['normal','Normal']];if(['explore','saved'].includes(state.demo.page))opts.push(['empty','Empty state']);if(state.demo.page==='editor')opts.push(['conflict','Save conflict']);return `<div class="demo-bar"><span>DESIGN SKETCH · Example data only</span>${opts.length>1?`<label>Demo state <select id="ed-scenario">${opts.map(([v,t])=>`<option value="${v}" ${scenario===v?'selected':''}>${t}</option>`).join('')}</select></label>`:''}</div>`;}
function render(){site.className='site'+(state.demo.narrow?' narrow':'');site.innerHTML=`<header class="site-header">${btn('<span class="brand-mark" aria-hidden="true"></span>Agent Lab','data-go="explore"','brand')}${btn('Menu','data-menu aria-expanded="false"','secondary menu')}<nav class="nav" aria-label="Website preview">${[['explore','Explore resources'],['saved','Workspace'],['suggest','Suggest a resource']].map(([p,t])=>btn(t,`data-go="${p}" ${state.demo.page===p||(p==='explore'&&state.demo.page==='detail')||(p==='saved'&&state.demo.page==='editor')?'aria-current="page"':''}`,'')).join('')}</nav></header>${demoOptions()}${state.demo.page==='explore'?explore():state.demo.page==='detail'?detail():state.demo.page==='saved'?saved():state.demo.page==='editor'?editor():suggest()}<div id="ed-notice" role="status" ${notice?'class="notice" style="margin:0 30px 23px"':''}>${esc(notice)}</div><footer class="site-footer"><span>Agent Lab / A considered collection</span>${btn('Suggest a resource','data-go="suggest"','line-button')}</footer>`;sync();}
function newDraft(){draft={id:null,name:'Untitled setup',purpose:'A new resource setup.',bindings:[]};dirty=true;undo=null;}
function add(i,v){const b={r:i,v:v||latest(i)};if(replace!==null){draft.bindings.splice(replace,1,b);replace=null;}else if(!draft.bindings.some(x=>x.r===i&&x.v===b.v))draft.bindings.push(b);dirty=true;undo=null;notice=data[i].name+' · '+b.v+' added to this sketch only.';}
function save(copy=false){if(!draft.name.trim()){notice='Enter a setup name before saving this sketch.';render();return;}if(!draft.bindings.length){notice='Add at least one resource before saving this sketch.';render();return;}if(copy||draft.id===null){draft.id=Math.max(0,...setups.map(s=>s.id))+1;if(copy)draft.name+=' copy';setups.push(clone(draft));}else{const n=setups.findIndex(s=>s.id===draft.id);setups[n]=clone(draft);}dirty=false;scenario='normal';notice='Saved in this preview only. Reloading clears every example change.';render();}
root.addEventListener('change',e=>{const t=e.target;if(t.id==='ed-narrow'){state.demo.narrow=t.checked;render();}if(t.id==='ed-discovery'){state.design.discovery=t.value;browseAll=false;query='';kind='All';go('explore');root.querySelector('.stage').scrollIntoView({block:'start'});}if(t.id==='ed-trust'){state.design.evidence=t.value;go('detail');root.querySelector('.stage').scrollIntoView({block:'start'});}if(t.id==='ed-picker'){state.design.picker=t.value;pickerOpen=t.value==='beside';go('editor');root.querySelector('.stage').scrollIntoView({block:'start'});}if(t.id==='ed-version'){version=t.value;render();}if(t.id==='ed-scenario'){scenario=t.value;notice='';render();}if(t.id==='ed-picker-kind'){pickerKind=t.value;render();}});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='ed-draft-name'){draft.name=t.value;dirty=true;document.getElementById('ed-save-state').textContent='Unsaved changes in this sketch';}const fields={'ed-link':'link','ed-purpose':'purpose','ed-resource-name':'name','ed-example':'example'};if(fields[t.id])suggestion[fields[t.id]]=t.value;});
root.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const actions={'ed-query':'[data-search]','ed-setup-query':'[data-setup-search]','ed-picker-query':'[data-picker-search]'};if(actions[e.target.id]){e.preventDefault();site.querySelector(actions[e.target.id]).click();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){go(d.page);return;}if(d.go){go(d.go);return;}if(d.resource!==undefined){openResource(+d.resource);return;}if('menu'in d){const n=site.querySelector('.nav');n.classList.toggle('open');b.setAttribute('aria-expanded',String(n.classList.contains('open')));return;}if('search'in d){query=site.querySelector('#ed-query').value;scenario='normal';render();return;}if(d.kind){kind=d.kind;render();return;}if('clear'in d){query='';kind='All';browseAll=false;scenario='normal';render();return;}if('all'in d){browseAll=true;render();return;}if('destination'in d){destination=true;render();return;}if('cancelAdd'in d){destination=false;render();return;}if('confirmAdd'in d){const choice=site.querySelector('#ed-destination').value;if(choice==='new')newDraft();else if(choice!=='current')draft=clone(setups.find(s=>s.id===+choice));replace=null;add(resource,version);state.demo.page='editor';destination=false;scenario='normal';render();return;}if('setupSearch'in d){setupQuery=site.querySelector('#ed-setup-query').value;render();return;}if('clearSetups'in d){setupQuery='';scenario='normal';render();return;}if('new'in d){newDraft();go('editor');return;}if(d.open){draft=clone(setups.find(s=>s.id===+d.open));dirty=false;undo=null;replace=null;go('editor');return;}if(d.duplicate){const s=clone(setups.find(s=>s.id===+d.duplicate));s.id=Math.max(...setups.map(s=>s.id))+1;s.name+=' copy';setups.push(s);notice='Created an independent example copy with the same resource versions. Nothing was saved outside this sketch.';render();return;}if(d.pick){pickerKind=d.pick;pickerOpen=true;pickerQuery='';replace=null;render();site.querySelector('.picker')?.scrollIntoView({block:'nearest'});return;}if(d.replace!==undefined){replace=+d.replace;pickerOpen=true;pickerKind=kinds.find(k=>k!=='All'&&matches(data[draft.bindings[replace].r],k))||'All';render();return;}if(d.remove!==undefined){undo=clone(draft.bindings);draft.bindings.splice(+d.remove,1);dirty=true;replace=null;render();return;}if('undo'in d){draft.bindings=undo;undo=null;dirty=true;render();return;}if('pickerSearch'in d){pickerQuery=site.querySelector('#ed-picker-query').value;render();return;}if('closePicker'in d){pickerOpen=false;replace=null;render();return;}if(d.add!==undefined){add(+d.add);render();return;}if('save'in d){if(scenario==='conflict'){notice='Your draft is preserved. Keep it as a copy rather than overwriting a newer version.';render();}else save();return;}if('conflictCopy'in d){save(true);return;}if('review'in d){errors=!/^https?:\/\/\S+\.\S+$/i.test(suggestion.link)||!suggestion.purpose.trim()||Boolean(suggestion.example&&!/^https?:\/\/\S+\.\S+$/i.test(suggestion.example));if(!errors)suggestStep='review';render();return;}if('editSuggestion'in d){suggestStep='form';render();return;}if('send'in d){suggestStep='sent';render();return;}if('another'in d){suggestion={link:'',purpose:'',name:'',example:''};suggestStep='form';errors=false;render();}});
render();
})();
</script></html>
